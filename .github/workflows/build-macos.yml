name: Build macOS Installer

on:
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at noon UTC
  workflow_dispatch:  # Manual trigger

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install numpy scipy matplotlib PySide6 requests PyJWT pyinstaller
          pip install -e .

      - name: Build with PyInstaller
        run: |
          cd installer
          pyinstaller forge_macos.spec --noconfirm --clean

      - name: Create DMG
        run: |
          hdiutil create -volname "Forge IDE" -srcfolder installer/dist/Forge.app -ov -format UDZO Forge_Setup_macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forge-macOS-installer
          path: Forge_Setup_macOS.dmg
          retention-days: 90
