name: Build Windows Installer

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at noon UTC

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install numpy scipy matplotlib PySide6 requests PyJWT pyinstaller
          pip install -e .

      - name: Build with PyInstaller
        run: |
          cd installer
          pyinstaller forge_windows.spec --noconfirm --clean

      - name: Create ZIP archive
        run: |
          cd installer/dist
          Compress-Archive -Path Forge -DestinationPath Forge_Setup_Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Windows-installer
          path: installer/dist/Forge_Setup_Windows.zip
          retention-days: 90
