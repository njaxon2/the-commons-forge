[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ide"
version = "0.1.9"
description = "Octave-compatible numerical computing environment with PySide6 GUI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pytest-xvfb"]
symbolic = ["sympy>=1.12"]
full = ["sympy>=1.12", "soundfile", "requests"]

[project.gui-scripts]
forge = "forge.__main__:main"

[project.scripts]
forge-cli = "forge.__main__:main"

[project.urls]
Homepage = "https://github.com/forge-ide/forge"
Documentation = "https://forge-ide.readthedocs.io"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-v --tb=short"
