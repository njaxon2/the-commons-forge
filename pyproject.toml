[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-engine"
version = "0.3.15"
description = "Forge Engine: open-source Octave-compatible numerical computing in Python"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest"]
symbolic = ["sympy>=1.12"]
full = ["sympy>=1.12", "soundfile", "requests"]

[project.scripts]
forge-cli = "forge.__main__:main"

[project.urls]
Homepage = "https://github.com/njaxon2/the-commons-forge"
Documentation = "https://thecommons.cc"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with -m \"not slow\")",
    "security: marks security audit tests",
]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
    "ignore:The get_cmap function was deprecated:matplotlib.MatplotlibDeprecationWarning",
    "ignore:Failed to disconnect:RuntimeWarning",
    "ignore:Input has data type:FutureWarning",
    "ignore:invalid value encountered:RuntimeWarning",
]
